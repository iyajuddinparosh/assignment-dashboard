<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0369a1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Payroll</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Employee Payroll System</h1>
      <form id="payrollForm">
        <label>Employee name<input id="name" required /></label
        ><label
          >Basic salary (Tk)<input
            id="salary"
            type="number"
            min="0"
            value="40000"
            required /></label
        ><label
          >Overtime hours<input
            id="hours"
            type="number"
            min="0"
            step="0.5"
            value="0"
            required /></label
        ><button>Generate Payslip</button>
      </form>
      <section id="payslip" class="result" hidden></section>
    </main>
    <script src="script.js"></script>
  </body>
</html>

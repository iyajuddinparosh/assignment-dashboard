<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#4d7c0f" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Inventory Management</h1>
      <form id="inventoryForm">
        <label>Product name<input id="product" required /></label
        ><label
          >Purchase price per unit (Tk)<input
            id="purchase"
            type="number"
            min="0"
            step="0.01"
            required /></label
        ><label
          >Selling price per unit (Tk)<input
            id="selling"
            type="number"
            min="0"
            step="0.01"
            required /></label
        ><label
          >Quantity<input
            id="quantity"
            type="number"
            min="0"
            step="1"
            required /></label
        ><button>Add Product</button>
      </form>
      <div class="grid stats">
        <div class="stat">
          Stock value<strong id="stockValue">Tk 0.00</strong>
        </div>
        <div class="stat">
          Expected revenue<strong id="revenue">Tk 0.00</strong>
        </div>
        <div class="stat">
          Expected profit<strong id="profit">Tk 0.00</strong>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Purchase</th>
              <th>Selling</th>
              <th>Qty</th>
              <th>Stock value</th>
              <th>Revenue</th>
              <th>Profit</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="inventory"></tbody>
        </table>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>

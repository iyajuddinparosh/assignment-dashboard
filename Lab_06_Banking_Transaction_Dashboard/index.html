<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="theme-color" content="#047857"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Banking Dashboard</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><h1>Banking Transaction Dashboard</h1><p class="muted">Demo account — stored in this browser only</p><div class="balance">Current balance <strong id="balance">Tk 0.00</strong></div><label>Amount (Tk)<input id="amount" type="number" min="0.01" step="0.01" onkeyup="if(event.key==='Enter') deposit()"></label><div class="actions"><button onclick="deposit()">Deposit</button><button class="secondary" onclick="withdraw()">Withdraw</button></div><p id="message" aria-live="polite"></p><h2>Transaction History</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Balance</th></tr></thead><tbody id="history"></tbody></table></div><button class="secondary" onclick="clearHistory()">Clear History</button></main><script src="script.js"></script></body></html>
